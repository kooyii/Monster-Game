<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>兑换申请 - 家庭积分</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { 'star-yellow': '#FBBF24', 'reward-green': '#10B981', 'points-blue': '#3B82F6', 'fun-pink': '#EC4899', 'fun-purple': '#8B5CF6' } } }
    }
  </script>
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-fun-purple text-white shadow-lg">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2"><span class="text-2xl">⭐</span><span class="font-bold text-lg">家庭积分</span></div>
      <div class="hidden md:flex items-center gap-6 text-sm font-medium">
        <a href="/parent/dashboard.html" class="opacity-75 hover:opacity-100">控制台</a>
        <a href="/parent/children.html" class="opacity-75 hover:opacity-100">孩子管理</a>
        <a href="/parent/award.html" class="opacity-75 hover:opacity-100">奖励积分</a>
        <a href="/parent/rewards.html" class="opacity-75 hover:opacity-100">奖励目录</a>
        <a href="/parent/redemptions.html" class="opacity-100">兑换申请</a>
      </div>
      <button onclick="logout()" class="text-sm bg-white bg-opacity-20 hover:bg-opacity-30 px-3 py-1 rounded-lg">退出</button>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-4 py-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">兑换申请</h1>

    <!-- Tabs -->
    <div class="flex gap-1 bg-gray-100 rounded-xl p-1 mb-6 w-fit">
      <button id="tab-pending" onclick="setTab('pending')" class="px-4 py-2 rounded-lg text-sm font-medium bg-white shadow-sm text-fun-purple">待审核</button>
      <button id="tab-approved" onclick="setTab('approved')" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-500 hover:text-gray-700">已批准</button>
      <button id="tab-rejected" onclick="setTab('rejected')" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-500 hover:text-gray-700">已拒绝</button>
    </div>

    <div id="redemptions-list" class="space-y-4">
      <div class="text-gray-400 text-center py-8">加载中...</div>
    </div>
  </main>

  <!-- Reject modal -->
  <div id="reject-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm">
      <h2 class="text-lg font-bold mb-3">拒绝申请</h2>
      <p class="text-gray-600 text-sm mb-3">可以填写拒绝原因（可选）：</p>
      <textarea id="reject-note" rows="3" placeholder="告诉孩子为什么拒绝..." class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-fun-purple resize-none mb-4"></textarea>
      <input type="hidden" id="reject-id">
      <div class="flex gap-3">
        <button onclick="confirmReject()" class="flex-1 py-2 bg-red-500 text-white rounded-xl text-sm font-semibold hover:bg-red-600">确认拒绝</button>
        <button onclick="closeRejectModal()" class="flex-1 py-2 border border-gray-300 text-gray-700 rounded-xl text-sm hover:bg-gray-50">取消</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    requireAuth('parent');
    let currentTab = 'pending';

    function setTab(tab) {
      currentTab = tab;
      ['pending', 'approved', 'rejected'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === tab) {
          btn.className = 'px-4 py-2 rounded-lg text-sm font-medium bg-white shadow-sm text-fun-purple';
        } else {
          btn.className = 'px-4 py-2 rounded-lg text-sm font-medium text-gray-500 hover:text-gray-700';
        }
      });
      loadRedemptions();
    }

    async function loadRedemptions() {
      const el = document.getElementById('redemptions-list');
      el.innerHTML = '<div class="text-gray-400 text-center py-8">加载中...</div>';

      const res = await apiFetch(`/redemptions?status=${currentTab}`);
      if (!res) return;
      const items = await res.json();

      if (items.length === 0) {
        const labels = { pending: '待审核', approved: '已批准', rejected: '已拒绝' };
        el.innerHTML = `<div class="text-gray-400 text-center py-8">暂无${labels[currentTab]}申请</div>`;
        return;
      }

      el.innerHTML = items.map(r => `
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
          <div class="flex items-start justify-between">
            <div class="flex items-center gap-3">
              <span class="text-3xl">${r.avatar_emoji}</span>
              <div>
                <div class="font-bold text-gray-800">${r.child_name}</div>
                <div class="text-gray-500 text-sm">${new Date(r.created_at).toLocaleString('zh-CN')}</div>
              </div>
            </div>
            <span class="text-sm px-2 py-0.5 rounded-full font-medium
              ${r.status === 'pending' ? 'bg-yellow-50 text-yellow-700' :
                r.status === 'approved' ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-600'}">
              ${r.status === 'pending' ? '待审核' : r.status === 'approved' ? '已批准' : '已拒绝'}
            </span>
          </div>

          <div class="mt-3 flex items-center gap-3 p-3 bg-gray-50 rounded-xl">
            <span class="text-3xl">${r.reward_emoji}</span>
            <div class="flex-1">
              <div class="font-semibold text-gray-800">${r.reward_name}</div>
              <div class="text-sm text-fun-purple font-medium">${r.points_cost} 积分</div>
            </div>
          </div>

          ${r.notes ? `<div class="mt-2 text-sm text-gray-500 italic">"${r.notes}"</div>` : ''}

          ${r.status === 'pending' ? `
            <div class="mt-4 flex gap-3">
              <button onclick="approve(${r.id})" class="flex-1 py-2 bg-reward-green text-white rounded-xl text-sm font-semibold hover:opacity-90">✓ 批准</button>
              <button onclick="openRejectModal(${r.id})" class="flex-1 py-2 bg-red-500 text-white rounded-xl text-sm font-semibold hover:opacity-90">✗ 拒绝</button>
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    async function approve(id) {
      const res = await apiFetch(`/redemptions/${id}`, {
        method: 'PUT',
        body: { status: 'approved' }
      });
      if (!res) return;
      const data = await res.json();
      if (!res.ok) { showToast(data.error || '操作失败', 'error'); return; }
      showToast('已批准！积分已扣除');
      loadRedemptions();
    }

    function openRejectModal(id) {
      document.getElementById('reject-id').value = id;
      document.getElementById('reject-note').value = '';
      document.getElementById('reject-modal').classList.remove('hidden');
    }
    function closeRejectModal() {
      document.getElementById('reject-modal').classList.add('hidden');
    }

    async function confirmReject() {
      const id = document.getElementById('reject-id').value;
      const notes = document.getElementById('reject-note').value.trim();

      const res = await apiFetch(`/redemptions/${id}`, {
        method: 'PUT',
        body: { status: 'rejected', notes: notes || undefined }
      });
      if (!res) return;
      const data = await res.json();
      if (!res.ok) { showToast(data.error || '操作失败', 'error'); return; }
      showToast('已拒绝');
      closeRejectModal();
      loadRedemptions();
    }

    loadRedemptions();
  </script>
</body>
</html>
