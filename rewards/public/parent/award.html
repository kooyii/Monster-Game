<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>奖励积分 - 家庭积分</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { 'star-yellow': '#FBBF24', 'reward-green': '#10B981', 'points-blue': '#3B82F6', 'fun-pink': '#EC4899', 'fun-purple': '#8B5CF6' } } }
    }
  </script>
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-fun-purple text-white shadow-lg">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2"><span class="text-2xl">⭐</span><span class="font-bold text-lg">家庭积分</span></div>
      <div class="hidden md:flex items-center gap-6 text-sm font-medium">
        <a href="/parent/dashboard.html" class="opacity-75 hover:opacity-100">控制台</a>
        <a href="/parent/children.html" class="opacity-75 hover:opacity-100">孩子管理</a>
        <a href="/parent/award.html" class="opacity-100">奖励积分</a>
        <a href="/parent/rewards.html" class="opacity-75 hover:opacity-100">奖励目录</a>
        <a href="/parent/redemptions.html" class="opacity-75 hover:opacity-100">兑换申请</a>
      </div>
      <button onclick="logout()" class="text-sm bg-white bg-opacity-20 hover:bg-opacity-30 px-3 py-1 rounded-lg">退出</button>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto px-4 py-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">奖励积分</h1>

    <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
      <!-- Child selector -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">选择孩子</label>
        <select id="child-select" onchange="updateBalance()"
          class="w-full px-4 py-3 border border-gray-200 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-fun-purple">
          <option value="">请选择孩子...</option>
        </select>
        <div id="current-balance" class="mt-1 text-sm text-gray-500 hidden">
          当前积分: <span class="font-semibold text-fun-purple" id="balance-value">0</span>
        </div>
      </div>

      <!-- Points input -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">积分数量</label>
        <input type="number" id="points-input" placeholder="正数为奖励，负数为扣除" oninput="updatePreview()"
          class="w-full px-4 py-3 border border-gray-200 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-fun-purple">
        <div id="negative-warning" class="hidden mt-1 text-sm text-orange-500">⚠️ 负数将扣除积分</div>
        <div id="balance-preview" class="hidden mt-1 text-sm text-gray-500">
          操作后积分: <span id="preview-value" class="font-semibold">0</span>
        </div>
      </div>

      <!-- Description -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">原因</label>
        <input type="text" id="desc-input" placeholder="填写获得积分的原因"
          class="w-full px-4 py-3 border border-gray-200 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-fun-purple">
      </div>

      <!-- Quick chips -->
      <div class="mb-5">
        <div class="text-sm text-gray-500 mb-2">快速填写：</div>
        <div class="flex flex-wrap gap-2" id="quick-chips">
          <button onclick="setDesc('洗碗了')" class="px-3 py-1 bg-purple-50 text-fun-purple rounded-full text-sm hover:bg-purple-100">洗碗了</button>
          <button onclick="setDesc('做了作业')" class="px-3 py-1 bg-purple-50 text-fun-purple rounded-full text-sm hover:bg-purple-100">做了作业</button>
          <button onclick="setDesc('帮忙做家务')" class="px-3 py-1 bg-purple-50 text-fun-purple rounded-full text-sm hover:bg-purple-100">帮忙做家务</button>
          <button onclick="setDesc('整理房间了')" class="px-3 py-1 bg-purple-50 text-fun-purple rounded-full text-sm hover:bg-purple-100">整理房间了</button>
          <button onclick="setDesc('帮助了弟弟妹妹')" class="px-3 py-1 bg-purple-50 text-fun-purple rounded-full text-sm hover:bg-purple-100">帮助了弟弟妹妹</button>
          <button onclick="setDesc('考试成绩好')" class="px-3 py-1 bg-purple-50 text-fun-purple rounded-full text-sm hover:bg-purple-100">考试成绩好</button>
          <button onclick="setDesc('态度不好')" class="px-3 py-1 bg-red-50 text-red-500 rounded-full text-sm hover:bg-red-100">态度不好</button>
        </div>
      </div>

      <button onclick="submitAward()" class="w-full py-3 bg-fun-purple text-white rounded-xl font-semibold text-base hover:opacity-90">
        确认发放
      </button>
    </div>

    <!-- Recent awards for selected child -->
    <div id="child-history" class="mt-6 bg-white rounded-2xl p-6 shadow-sm border border-gray-100 hidden">
      <h2 class="text-lg font-bold text-gray-800 mb-4">该孩子的最近记录</h2>
      <div id="history-list" class="space-y-2 text-sm"></div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    requireAuth('parent');
    let children = [];

    async function init() {
      const res = await apiFetch('/users/children');
      if (!res) return;
      children = await res.json();
      const sel = document.getElementById('child-select');
      children.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.dataset.points = c.points;
        opt.textContent = `${c.avatar_emoji} ${c.name} — 当前 ${c.points} 积分`;
        sel.appendChild(opt);
      });
    }

    function updateBalance() {
      const sel = document.getElementById('child-select');
      const opt = sel.options[sel.selectedIndex];
      if (!opt || !opt.value) {
        document.getElementById('current-balance').classList.add('hidden');
        document.getElementById('child-history').classList.add('hidden');
        return;
      }
      const pts = parseInt(opt.dataset.points) || 0;
      document.getElementById('balance-value').textContent = pts;
      document.getElementById('current-balance').classList.remove('hidden');
      updatePreview();
      loadChildHistory(opt.value);
    }

    function updatePreview() {
      const sel = document.getElementById('child-select');
      const opt = sel.options[sel.selectedIndex];
      const pts = parseInt(document.getElementById('points-input').value) || 0;
      const warning = document.getElementById('negative-warning');
      const preview = document.getElementById('balance-preview');

      if (pts < 0) warning.classList.remove('hidden');
      else warning.classList.add('hidden');

      if (opt && opt.value && pts !== 0) {
        const current = parseInt(opt.dataset.points) || 0;
        const newBal = current + pts;
        const previewVal = document.getElementById('preview-value');
        previewVal.textContent = newBal;
        previewVal.className = `font-semibold ${newBal >= 0 ? 'text-reward-green' : 'text-red-500'}`;
        preview.classList.remove('hidden');
      } else {
        preview.classList.add('hidden');
      }
    }

    function setDesc(text) {
      document.getElementById('desc-input').value = text;
    }

    async function loadChildHistory(childId) {
      const res = await apiFetch(`/points/transactions?child_id=${childId}&limit=5`);
      if (!res) return;
      const transactions = await res.json();
      const container = document.getElementById('child-history');
      const list = document.getElementById('history-list');
      container.classList.remove('hidden');

      if (transactions.length === 0) {
        list.innerHTML = '<div class="text-gray-400 text-center py-2">暂无记录</div>';
        return;
      }

      list.innerHTML = transactions.map(t => `
        <div class="flex justify-between items-center py-1.5 border-b border-gray-50 last:border-0">
          <div>
            <span class="${t.points > 0 ? 'text-reward-green' : 'text-red-500'} font-semibold">${t.points > 0 ? '+' : ''}${t.points}</span>
            <span class="ml-2 text-gray-600">${t.description}</span>
          </div>
          <span class="text-gray-400 text-xs">${new Date(t.created_at).toLocaleDateString('zh-CN')}</span>
        </div>
      `).join('');
    }

    async function submitAward() {
      const child_id = document.getElementById('child-select').value;
      const points = parseInt(document.getElementById('points-input').value);
      const description = document.getElementById('desc-input').value.trim();

      if (!child_id) { showToast('请选择孩子', 'error'); return; }
      if (!points || isNaN(points)) { showToast('请填写有效的积分数量', 'error'); return; }
      if (!description) { showToast('请填写积分原因', 'error'); return; }

      const res = await apiFetch('/points/award', {
        method: 'POST',
        body: { child_id: parseInt(child_id), points, description }
      });
      if (!res) return;

      const data = await res.json();
      if (!res.ok) { showToast(data.error || '操作失败', 'error'); return; }

      showToast(`积分已${points > 0 ? '奖励' : '扣除'}！新余额: ${data.new_balance}`);
      document.getElementById('points-input').value = '';
      document.getElementById('desc-input').value = '';

      // Update option's data-points
      const sel = document.getElementById('child-select');
      const opt = sel.options[sel.selectedIndex];
      if (opt) {
        opt.dataset.points = data.new_balance;
        opt.textContent = `${children.find(c => c.id == child_id)?.avatar_emoji || '🧒'} ${children.find(c => c.id == child_id)?.name} — 当前 ${data.new_balance} 积分`;
      }
      document.getElementById('balance-value').textContent = data.new_balance;
      document.getElementById('current-balance').classList.remove('hidden');
      document.getElementById('balance-preview').classList.add('hidden');
      loadChildHistory(child_id);
    }

    init();
  </script>
</body>
</html>
