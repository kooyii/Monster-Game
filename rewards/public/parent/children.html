<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>孩子管理 - 家庭积分</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { 'star-yellow': '#FBBF24', 'reward-green': '#10B981', 'points-blue': '#3B82F6', 'fun-pink': '#EC4899', 'fun-purple': '#8B5CF6' } } }
    }
  </script>
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-fun-purple text-white shadow-lg">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2"><span class="text-2xl">⭐</span><span class="font-bold text-lg">家庭积分</span></div>
      <div class="hidden md:flex items-center gap-6 text-sm font-medium">
        <a href="/parent/dashboard.html" class="opacity-75 hover:opacity-100">控制台</a>
        <a href="/parent/children.html" class="opacity-100">孩子管理</a>
        <a href="/parent/award.html" class="opacity-75 hover:opacity-100">奖励积分</a>
        <a href="/parent/rewards.html" class="opacity-75 hover:opacity-100">奖励目录</a>
        <a href="/parent/redemptions.html" class="opacity-75 hover:opacity-100">兑换申请</a>
      </div>
      <button onclick="logout()" class="text-sm bg-white bg-opacity-20 hover:bg-opacity-30 px-3 py-1 rounded-lg">退出</button>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-6">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-gray-800">孩子管理</h1>
      <button onclick="showAddForm()" class="bg-fun-purple text-white px-4 py-2 rounded-xl text-sm font-semibold hover:opacity-90">+ 添加孩子</button>
    </div>

    <!-- Add Form -->
    <div id="add-form" class="hidden bg-white rounded-2xl p-6 shadow-sm border border-fun-purple mb-6">
      <h2 class="text-lg font-bold mb-4">添加孩子账号</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">显示名称</label>
          <input type="text" id="add-name" placeholder="如：小明" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-fun-purple">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
          <input type="text" id="add-username" placeholder="登录用户名" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-fun-purple">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
          <input type="password" id="add-password" placeholder="至少4位" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-fun-purple">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">头像</label>
          <div id="emoji-picker" class="flex flex-wrap gap-2 mt-1">
            <input type="hidden" id="add-emoji" value="🧒">
          </div>
        </div>
      </div>
      <div class="flex gap-3 mt-4">
        <button onclick="addChild()" class="bg-fun-purple text-white px-6 py-2 rounded-xl text-sm font-semibold hover:opacity-90">保存</button>
        <button onclick="hideAddForm()" class="border border-gray-300 text-gray-700 px-6 py-2 rounded-xl text-sm hover:bg-gray-50">取消</button>
      </div>
    </div>

    <!-- Children List -->
    <div id="children-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="text-gray-400 col-span-full text-center py-8">加载中...</div>
    </div>
  </main>

  <!-- Edit Modal -->
  <div id="edit-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md">
      <h2 class="text-lg font-bold mb-4">编辑孩子信息</h2>
      <input type="hidden" id="edit-id">
      <div class="space-y-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">显示名称</label>
          <input type="text" id="edit-name" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-fun-purple">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">新密码（留空不修改）</label>
          <input type="password" id="edit-password" placeholder="留空则不修改" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-fun-purple">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">头像</label>
          <div id="edit-emoji-picker" class="flex flex-wrap gap-2 mt-1">
            <input type="hidden" id="edit-emoji">
          </div>
        </div>
      </div>
      <div class="flex gap-3 mt-4">
        <button onclick="saveEdit()" class="bg-fun-purple text-white px-6 py-2 rounded-xl text-sm font-semibold hover:opacity-90">保存</button>
        <button onclick="closeEditModal()" class="border border-gray-300 text-gray-700 px-6 py-2 rounded-xl text-sm hover:bg-gray-50">取消</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    requireAuth('parent');

    const EMOJIS = ['🧒', '👧', '👦', '🧑', '🦊', '🐱', '🐶', '🐸', '🦁', '🐯', '🐼', '🐨', '🦄', '🐲', '🚀', '⭐'];

    function buildEmojiPicker(containerId, hiddenInputId, selected = '🧒') {
      const container = document.getElementById(containerId);
      const input = document.getElementById(hiddenInputId);
      container.innerHTML = '';
      container.appendChild(input);
      EMOJIS.forEach(e => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = e;
        btn.className = `text-2xl w-10 h-10 rounded-xl hover:bg-gray-100 ${e === selected ? 'ring-2 ring-fun-purple bg-purple-50' : ''}`;
        btn.onclick = () => {
          input.value = e;
          container.querySelectorAll('button').forEach(b => b.className = `text-2xl w-10 h-10 rounded-xl hover:bg-gray-100`);
          btn.className = 'text-2xl w-10 h-10 rounded-xl ring-2 ring-fun-purple bg-purple-50';
        };
        container.appendChild(btn);
      });
      input.value = selected;
    }

    buildEmojiPicker('emoji-picker', 'add-emoji');

    async function loadChildren() {
      const res = await apiFetch('/users/children');
      if (!res) return;
      const children = await res.json();
      const el = document.getElementById('children-list');

      if (children.length === 0) {
        el.innerHTML = '<div class="text-gray-400 col-span-full text-center py-8">还没有孩子账号，点击"添加孩子"创建</div>';
        return;
      }

      el.innerHTML = children.map(c => `
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
          <div class="flex items-start justify-between mb-3">
            <div class="flex items-center gap-3">
              <span class="text-4xl">${c.avatar_emoji}</span>
              <div>
                <div class="font-bold text-gray-800">${c.name}</div>
                <div class="text-sm text-gray-500">@${c.username}</div>
              </div>
            </div>
            <div class="text-right">
              <div class="text-2xl font-bold text-fun-purple">${c.points}</div>
              <div class="text-xs text-gray-400">积分</div>
            </div>
          </div>
          <div class="flex gap-2">
            <button onclick='openEditModal(${JSON.stringify(c)})' class="flex-1 py-1.5 text-sm border border-gray-200 rounded-lg hover:bg-gray-50">编辑</button>
            <button onclick="deleteChild(${c.id}, '${c.name}')" class="flex-1 py-1.5 text-sm border border-red-200 text-red-500 rounded-lg hover:bg-red-50">删除</button>
          </div>
        </div>
      `).join('');
    }

    function showAddForm() {
      document.getElementById('add-form').classList.remove('hidden');
      buildEmojiPicker('emoji-picker', 'add-emoji');
    }
    function hideAddForm() {
      document.getElementById('add-form').classList.add('hidden');
    }

    async function addChild() {
      const name = document.getElementById('add-name').value.trim();
      const username = document.getElementById('add-username').value.trim();
      const password = document.getElementById('add-password').value;
      const avatar_emoji = document.getElementById('add-emoji').value;

      if (!name || !username || !password) {
        showToast('请填写所有必填字段', 'error');
        return;
      }

      const res = await apiFetch('/users/children', {
        method: 'POST',
        body: { name, username, password, avatar_emoji }
      });
      if (!res) return;

      const data = await res.json();
      if (!res.ok) {
        showToast(data.error || '创建失败', 'error');
        return;
      }

      showToast('孩子账号已创建！');
      hideAddForm();
      ['add-name', 'add-username', 'add-password'].forEach(id => document.getElementById(id).value = '');
      loadChildren();
    }

    function openEditModal(child) {
      document.getElementById('edit-id').value = child.id;
      document.getElementById('edit-name').value = child.name;
      document.getElementById('edit-password').value = '';
      buildEmojiPicker('edit-emoji-picker', 'edit-emoji', child.avatar_emoji);
      document.getElementById('edit-modal').classList.remove('hidden');
    }
    function closeEditModal() {
      document.getElementById('edit-modal').classList.add('hidden');
    }

    async function saveEdit() {
      const id = document.getElementById('edit-id').value;
      const name = document.getElementById('edit-name').value.trim();
      const password = document.getElementById('edit-password').value;
      const avatar_emoji = document.getElementById('edit-emoji').value;

      const body = { name, avatar_emoji };
      if (password) body.password = password;

      const res = await apiFetch(`/users/${id}`, { method: 'PUT', body });
      if (!res) return;

      const data = await res.json();
      if (!res.ok) {
        showToast(data.error || '更新失败', 'error');
        return;
      }

      showToast('已更新！');
      closeEditModal();
      loadChildren();
    }

    function deleteChild(id, name) {
      showModal('删除确认', `确定要删除 ${name} 的账号吗？`, async () => {
        const res = await apiFetch(`/users/${id}`, { method: 'DELETE' });
        if (!res) return;
        if (!res.ok) {
          const data = await res.json();
          showToast(data.error || '删除失败', 'error');
          return;
        }
        showToast('账号已删除');
        loadChildren();
      });
    }

    loadChildren();
  </script>
</body>
</html>
