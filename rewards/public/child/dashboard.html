<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的积分 - 家庭积分</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { 'star-yellow': '#FBBF24', 'reward-green': '#10B981', 'points-blue': '#3B82F6', 'fun-pink': '#EC4899', 'fun-purple': '#8B5CF6', 'fun-orange': '#F97316', 'fun-teal': '#14B8A6' } } }
    }
  </script>
  <style>
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    @keyframes sparkle { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.3)} }
    @keyframes bounce-in { 0%{transform:scale(0.5);opacity:0} 70%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }
    @keyframes slide-up { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
    .float-anim { animation: float 3s ease-in-out infinite; }
    .sparkle-anim { animation: sparkle 2s ease-in-out infinite; }
    .bounce-in { animation: bounce-in 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    .slide-up { animation: slide-up 0.5s ease-out forwards; }
    .card-hover { transition: transform 0.2s, box-shadow 0.2s; }
    .card-hover:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(139,92,246,0.2); }
    .rank-1 { background: linear-gradient(135deg, #FFD700, #FFA500); }
    .rank-2 { background: linear-gradient(135deg, #C0C0C0, #A0A0A0); }
    .rank-3 { background: linear-gradient(135deg, #CD7F32, #A0522D); }
    .shimmer-bg { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); background-size: 200% 100%; animation: shimmer 2s infinite; }
    .star-decoration::before { content: '⭐'; position: absolute; font-size: 1rem; opacity: 0.3; }
  </style>
</head>
<body class="bg-gradient-to-br from-purple-50 via-pink-50 to-yellow-50 min-h-screen pb-24">

  <!-- Top Nav -->
  <nav class="bg-gradient-to-r from-fun-purple via-fun-pink to-fun-orange text-white shadow-xl relative overflow-hidden">
    <div class="absolute inset-0 shimmer-bg"></div>
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between relative z-10">
      <div class="flex items-center gap-2">
        <span id="nav-avatar" class="text-2xl sparkle-anim">🧒</span>
        <span id="nav-name" class="font-bold text-lg"></span>
      </div>
      <div class="flex items-center gap-2">
        <div class="bg-white bg-opacity-25 backdrop-blur rounded-full px-3 py-1.5 flex items-center gap-1 border border-white border-opacity-30">
          <span class="text-star-yellow text-lg sparkle-anim">⭐</span>
          <span id="nav-points" class="font-black text-lg">0</span>
        </div>
        <button onclick="logout()" class="text-xs bg-white bg-opacity-20 hover:bg-opacity-30 px-2 py-1 rounded-lg transition-all">退出</button>
      </div>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto px-4 py-5">

    <!-- Hero Card -->
    <div class="bg-gradient-to-br from-fun-purple via-fun-pink to-fun-orange rounded-3xl p-6 text-white mb-5 shadow-2xl card-hover relative overflow-hidden">
      <div class="absolute top-2 right-4 text-4xl opacity-20 float-anim">🌟</div>
      <div class="absolute bottom-2 left-4 text-3xl opacity-20 float-anim" style="animation-delay:1s">✨</div>
      <div class="text-center relative z-10">
        <div id="hero-avatar" class="text-7xl mb-2 float-anim inline-block">🧒</div>
        <div id="hero-greeting" class="text-xl font-bold mb-1">你好！</div>
        <div class="text-7xl font-black mb-1 bounce-in">
          <span id="balance-counter">0</span>
        </div>
        <div class="text-white text-opacity-90 text-base font-semibold">⭐ 积分</div>
      </div>
    </div>

    <!-- Leaderboard -->
    <div class="bg-white rounded-3xl p-5 shadow-lg border border-purple-100 mb-5 card-hover slide-up">
      <div class="flex items-center gap-2 mb-4">
        <span class="text-2xl">🏆</span>
        <h2 class="font-black text-gray-800 text-lg">积分排行榜</h2>
        <span class="text-xl">🏆</span>
      </div>
      <div id="leaderboard" class="space-y-3">
        <div class="text-gray-400 text-sm text-center py-3">加载中...</div>
      </div>
    </div>

    <!-- Quick Links -->
    <div class="grid grid-cols-2 gap-3 mb-5">
      <a href="/child/rules.html" class="bg-gradient-to-br from-fun-orange to-star-yellow rounded-2xl p-4 text-white text-center shadow-lg card-hover">
        <div class="text-3xl mb-1">📜</div>
        <div class="font-bold text-sm">积分规则</div>
        <div class="text-xs opacity-80">怎么赚积分？</div>
      </a>
      <a href="/child/catalog.html" class="bg-gradient-to-br from-reward-green to-fun-teal rounded-2xl p-4 text-white text-center shadow-lg card-hover">
        <div class="text-3xl mb-1">🎁</div>
        <div class="font-bold text-sm">兑换奖励</div>
        <div class="text-xs opacity-80">用积分换好东西！</div>
      </a>
    </div>

    <!-- Recent earnings -->
    <div class="bg-white rounded-3xl p-5 shadow-lg border border-pink-100 mb-4 card-hover slide-up">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <span class="text-xl">📈</span>
          <h2 class="font-bold text-gray-800">最近获得的积分</h2>
        </div>
        <a href="/child/history.html" class="text-sm text-fun-purple hover:underline font-semibold">查看全部 →</a>
      </div>
      <div id="recent-earn" class="space-y-2">
        <div class="text-gray-400 text-sm text-center py-3">加载中...</div>
      </div>
    </div>

    <!-- Affordable rewards -->
    <div class="bg-white rounded-3xl p-5 shadow-lg border border-green-100 mb-4 card-hover slide-up">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <span class="text-xl">🎉</span>
          <h2 class="font-bold text-gray-800">可以兑换的奖励</h2>
        </div>
        <a href="/child/catalog.html" class="text-sm text-fun-purple hover:underline font-semibold">全部奖励 →</a>
      </div>
      <div id="affordable-rewards" class="space-y-2">
        <div class="text-gray-400 text-sm text-center py-3">加载中...</div>
      </div>
    </div>

    <!-- Pending requests -->
    <div id="pending-section" class="hidden bg-gradient-to-r from-yellow-50 to-orange-50 rounded-3xl p-5 shadow-lg border border-yellow-200 mb-4">
      <h2 class="font-bold text-gray-800 mb-3 flex items-center gap-2"><span class="text-xl">⏳</span> 等待爸妈审核</h2>
      <div id="pending-list" class="space-y-2"></div>
    </div>

  </main>

  <!-- Bottom Nav -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-purple-100 shadow-2xl">
    <div class="flex max-w-2xl mx-auto">
      <a href="/child/dashboard.html" class="flex-1 flex flex-col items-center py-2.5 text-fun-purple">
        <span class="text-2xl">🏠</span><span class="text-xs font-bold">首页</span>
      </a>
      <a href="/child/history.html" class="flex-1 flex flex-col items-center py-2.5 text-gray-400 hover:text-fun-purple">
        <span class="text-2xl">📋</span><span class="text-xs">记录</span>
      </a>
      <a href="/child/catalog.html" class="flex-1 flex flex-col items-center py-2.5 text-gray-400 hover:text-fun-purple">
        <span class="text-2xl">🎁</span><span class="text-xs">奖励</span>
      </a>
      <a href="/child/rules.html" class="flex-1 flex flex-col items-center py-2.5 text-gray-400 hover:text-fun-purple">
        <span class="text-2xl">📜</span><span class="text-xs">规则</span>
      </a>
      <a href="/child/requests.html" class="flex-1 flex flex-col items-center py-2.5 text-gray-400 hover:text-fun-purple">
        <span class="text-2xl">📬</span><span class="text-xs">申请</span>
      </a>
    </div>
  </nav>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    const user = requireAuth('child');
    if (user) {
      document.getElementById('nav-avatar').textContent = user.avatar_emoji;
      document.getElementById('nav-name').textContent = user.name;
      document.getElementById('hero-avatar').textContent = user.avatar_emoji;
      document.getElementById('hero-greeting').textContent = `你好，${user.name}！`;
      loadDashboard();
    }

    function animateCounter(el, target, duration = 1200) {
      const start = performance.now();
      const update = (time) => {
        const progress = Math.min((time - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = Math.floor(eased * target);
        if (progress < 1) requestAnimationFrame(update);
      };
      requestAnimationFrame(update);
    }

    async function loadDashboard() {
      const [meRes, txRes, rewardsRes, pendingRes, lbRes] = await Promise.all([
        apiFetch('/users/me'),
        apiFetch('/points/transactions?limit=5'),
        apiFetch('/rewards'),
        apiFetch('/redemptions?status=pending'),
        apiFetch('/users/leaderboard')
      ]);
      if (!meRes) return;

      const me = await meRes.json();
      const transactions = txRes ? await txRes.json() : [];
      const rewards = rewardsRes ? await rewardsRes.json() : [];
      const pending = pendingRes ? await pendingRes.json() : [];
      const leaderboard = lbRes ? await lbRes.json() : [];

      animateCounter(document.getElementById('balance-counter'), me.points || 0);
      document.getElementById('nav-points').textContent = me.points || 0;

      const storedUser = JSON.parse(localStorage.getItem('rp_user') || '{}');
      storedUser.points = me.points;
      localStorage.setItem('rp_user', JSON.stringify(storedUser));

      // Leaderboard
      const lbEl = document.getElementById('leaderboard');
      const medals = ['🥇', '🥈', '🥉'];
      const rankColors = ['from-yellow-400 to-orange-400', 'from-gray-300 to-gray-400', 'from-amber-600 to-amber-700'];
      const bgColors = ['bg-yellow-50 border-yellow-200', 'bg-gray-50 border-gray-200', 'bg-amber-50 border-amber-200'];
      if (leaderboard.length === 0) {
        lbEl.innerHTML = '<div class="text-gray-400 text-sm text-center py-3">暂无数据</div>';
      } else {
        lbEl.innerHTML = leaderboard.map((child, idx) => {
          const isMe = child.id === me.id;
          const medal = medals[idx] || `${idx + 1}`;
          const bg = bgColors[idx] || 'bg-purple-50 border-purple-200';
          return `
            <div class="flex items-center gap-3 p-3 rounded-2xl border-2 ${bg} ${isMe ? 'ring-2 ring-fun-purple ring-offset-1' : ''} transition-all">
              <div class="text-3xl w-10 text-center">${medal}</div>
              <div class="text-3xl">${child.avatar_emoji}</div>
              <div class="flex-1">
                <div class="font-bold text-gray-800 ${isMe ? 'text-fun-purple' : ''}">
                  ${child.name} ${isMe ? '← 我' : ''}
                </div>
              </div>
              <div class="text-right">
                <div class="font-black text-2xl ${idx === 0 ? 'text-yellow-500' : idx === 1 ? 'text-gray-500' : idx === 2 ? 'text-amber-600' : 'text-fun-purple'}">${child.points}</div>
                <div class="text-xs text-gray-400">积分</div>
              </div>
            </div>
          `;
        }).join('');
      }

      // Recent earnings
      const earnEl = document.getElementById('recent-earn');
      const earnTx = transactions.filter(t => t.points > 0).slice(0, 3);
      if (earnTx.length === 0) {
        earnEl.innerHTML = '<div class="text-gray-400 text-sm text-center py-2">还没有积分记录，快去完成任务吧！💪</div>';
      } else {
        earnEl.innerHTML = earnTx.map(t => `
          <div class="flex items-center justify-between py-2 px-3 bg-green-50 rounded-xl border border-green-100">
            <div class="flex items-center gap-2">
              <span class="text-xl">⭐</span>
              <span class="text-gray-700 text-sm font-medium">${t.description}</span>
            </div>
            <span class="text-reward-green font-black text-lg">+${t.points}</span>
          </div>
        `).join('');
      }

      // Affordable rewards
      const affordableEl = document.getElementById('affordable-rewards');
      const affordable = rewards.filter(r => r.is_active && r.points_cost <= me.points).slice(0, 3);
      if (affordable.length === 0) {
        const cheapest = rewards.filter(r => r.is_active).sort((a, b) => a.points_cost - b.points_cost)[0];
        if (cheapest) {
          affordableEl.innerHTML = `
            <div class="text-center py-3 bg-purple-50 rounded-xl border border-purple-100">
              <div class="text-sm text-gray-600">再积累 <span class="font-black text-fun-purple text-lg">${cheapest.points_cost - me.points}</span> 分</div>
              <div class="text-sm text-gray-500">就能兑换 ${cheapest.emoji} <span class="font-semibold">${cheapest.name}</span>！加油！💪</div>
            </div>`;
        } else {
          affordableEl.innerHTML = '<div class="text-gray-400 text-sm text-center py-2">暂无可用奖励</div>';
        }
      } else {
        affordableEl.innerHTML = affordable.map(r => `
          <div class="flex items-center justify-between py-2.5 px-3 bg-green-50 rounded-xl border border-green-100">
            <div class="flex items-center gap-2">
              <span class="text-2xl">${r.emoji}</span>
              <span class="text-gray-700 text-sm font-medium">${r.name}</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-fun-purple text-sm font-bold">${r.points_cost}分</span>
              <a href="/child/catalog.html" class="text-xs bg-gradient-to-r from-fun-purple to-fun-pink text-white px-3 py-1 rounded-xl font-bold shadow">去兑换</a>
            </div>
          </div>
        `).join('');
      }

      // Pending requests
      if (pending.length > 0) {
        document.getElementById('pending-section').classList.remove('hidden');
        document.getElementById('pending-list').innerHTML = pending.map(p => `
          <div class="flex items-center gap-2 py-1.5">
            <span class="text-xl">${p.reward_emoji}</span>
            <span class="text-gray-700 text-sm flex-1">${p.reward_name}</span>
            <span class="text-yellow-600 text-xs bg-yellow-100 px-2 py-0.5 rounded-full font-semibold">⏳ 等待审核</span>
          </div>
        `).join('');
      }
    }
  </script>
</body>
</html>
