<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭积分系统 - 登录</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'star-yellow': '#FBBF24',
            'reward-green': '#10B981',
            'points-blue': '#3B82F6',
            'fun-pink': '#EC4899',
            'fun-purple': '#8B5CF6',
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-fun-purple to-points-blue flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="text-6xl mb-3">⭐</div>
      <h1 class="text-2xl font-bold text-gray-800">家庭积分系统</h1>
      <p class="text-gray-500 text-sm mt-1">Family Rewards</p>
    </div>

    <form id="login-form">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
        <input type="text" id="username" autocomplete="username"
          class="w-full px-4 py-3 border border-gray-200 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-fun-purple focus:border-transparent"
          placeholder="输入用户名">
      </div>
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
        <input type="password" id="password" autocomplete="current-password"
          class="w-full px-4 py-3 border border-gray-200 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-fun-purple focus:border-transparent"
          placeholder="输入密码">
      </div>
      <div id="error-msg" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-600 rounded-xl text-sm"></div>
      <button type="submit" id="login-btn"
        class="w-full py-3 bg-gradient-to-r from-fun-purple to-points-blue text-white font-semibold rounded-xl hover:opacity-90 transition-opacity text-base">
        登录
      </button>
    </form>
  </div>

  <script>
    // If already logged in, redirect
    const token = localStorage.getItem('rp_token');
    const user = JSON.parse(localStorage.getItem('rp_user') || 'null');
    if (token && user) {
      window.location.href = '/parent/dashboard.html';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('error-msg');
      const btn = document.getElementById('login-btn');

      if (!username || !password) {
        errEl.textContent = '请输入用户名和密码';
        errEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = '登录中...';
      errEl.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          errEl.textContent = data.error || '登录失败';
          errEl.classList.remove('hidden');
          return;
        }

        localStorage.setItem('rp_token', data.token);
        localStorage.setItem('rp_user', JSON.stringify(data.user));
        window.location.href = '/parent/dashboard.html';
      } catch (err) {
        errEl.textContent = '网络错误，请重试';
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = '登录';
      }
    });
  </script>
</body>
</html>
